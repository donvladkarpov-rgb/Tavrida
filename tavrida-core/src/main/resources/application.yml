spring:

  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/tavrida
    username: tavrida
    password: abirvalg
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: HikariCP-tavrida
      maximum-pool-size: 20
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 1200000
      leak-detection-threshold: 60000

  jpa:
    open-in-view: false
    generate-ddl: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        generate_statistics: false
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true
    default-schema: public
    user: tavrida
    password: abirvalg
    contexts: development

  mvc:
    format:
      date: iso
    throw-exception-if-no-handler-found: true
    static-path-pattern: "/static/**"

  web:
    resources:
      add-mappings: false

server:
  port: 8090
  servlet:
    context-path: /api
  error:
    include-stacktrace: never
    include-message: always
    include-binding-errors: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    root: INFO
    org.springframework: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.hibernate.stat: DEBUG
    liquibase: INFO
    vk.crud: DEBUG
    org.springframework.web: DEBUG
    org.springframework.web.servlet: DEBUG

  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

tavrida:
  common:
    constant:
      server-time-zone: ${SERVER_TIME_ZONE:Europe/Moscow}
      card-type:
        empty: ${CARD_TYPE_EMPTY:0}
        admin: ${CARD_TYPE_ADMIN:1}
        cashier: ${CARD_TYPE_CASHIER:2}
        driver: ${CARD_TYPE_DRIVER:3}
        passenger: ${CARD_TYPE_PASSENGER:4}
        terminal-activation: ${CARD_TYPE_TERMINAL_ACTIVATION:5}
        terminal-reset: ${CARD_TYPE_TERMINAL_RESET:6}
      user-roles:
        operator-funds-admin: ${USER_ROLE_OPERATOR_FUNDS_ADMIN:1}
        carrier-admin: ${USER_ROLE_CARRIER_ADMIN:2}
        cashier: ${USER_ROLE_CASHIER:3}
        driver: ${USER_ROLE_DRIVER:4}
      # Константы для таблицы CODES
      codes:
        # Типы кодов
        code-types:
          A: ${CODE_TYPE_A:A}
          S: ${CODE_TYPE_S:S}
        # Разрешенное использование
        allowed-usages:
          read-write: ${ALLOWED_USAGE_RW:RW}
          read-only: ${ALLOWED_USAGE_R:R}
          none: ${ALLOWED_USAGE_NONE:-}

      # Типы сервисных событий
      service-event-types:
        user-create: ${EVENT_TYPE_USER_CREATE:CU}
        card-create: ${EVENT_TYPE_CARD_CREATE:CC}
        user-delete: ${EVENT_TYPE_USER_DELETE:DU}
        card-delete: ${EVENT_TYPE_CARD_DELETE:DC}
        other-event: ${EVENT_TYPE_OTHER:OE}

      # Типы платежей
      payment-types:
        replenishment: ${PAYMENT_TYPE_REPLENISHMENT:1}
        write-off: ${PAYMENT_TYPE_WRITE_OFF:2}

      # Результаты платежей
      payment-results:
        success: ${PAYMENT_RESULT_SUCCESS:11}
        error-card-read: ${PAYMENT_RESULT_ERROR_CARD_READ:12}
        error-insufficient-funds: ${PAYMENT_RESULT_ERROR_INSUFFICIENT_FUNDS:13}
        error-card-blocked: ${PAYMENT_RESULT_ERROR_CARD_BLOCKED:14}
